# @package _global_
# hyperparameter optimization for CONLL NER with Optuna

defaults:
  - override /hydra/sweeper: optuna

# Set multirun mode explicitly
hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null  # Use in-memory storage
    study_name: conll_ner_optimization
    n_jobs: 1
    direction: maximize
    n_trials: 20
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 5  # Number of random trials before optimization starts

    # Define hyperparameter search space
    params:
      model.starting_lr: tag(log, interval(1e-5, 1e-3))
      model.max_lr: tag(log, interval(1e-4, 5e-3))
      model.weight_decay: tag(log, interval(1e-5, 1e-2))
      model.hidden_dropout_prob: interval(0.1, 0.6)
      model.attention_probs_dropout_prob: interval(0.1, 0.5)
      datamodule.batch_size: choice(1, 2, 4)
      trainer.max_epochs: choice(3, 5, 10)

# Metric to be optimized
optimized_metric: "val_score"