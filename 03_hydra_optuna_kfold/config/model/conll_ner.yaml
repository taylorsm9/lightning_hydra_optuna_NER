_target_: src.models.model.EncoderNERModel

# shared with the datamodule; set them there (datamodule.batch_size=8, datamodule.model_class=...)
model_class: ${datamodule.model_class}
IOB: ${datamodule.IOB}
num_labels: ${datamodule.num_labels}
batch_size: ${datamodule.batch_size}
hidden_dropout_prob: 0.1
attention_probs_dropout_prob: 0.1
starting_lr: 1e-5
max_lr: 1e-4
weight_decay: 0.01
pct_start: 0.3
flooding_val: 0.1
pred_output_path: ${paths.output_dir}/test_preds/test_data.pkl
confusion_matrix_path: ${paths.output_dir}/test_preds/confusion_matrix.csv