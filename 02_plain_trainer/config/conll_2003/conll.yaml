trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: conll
      log_model: False
      save_dir: './logs/conll'
      name: 'conll'
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_avg_f1
        mode: max
        save_top_k: 1
        dirpath: ./logs/conll/checkpoints/
        save_last: true
        every_n_epochs: 1
        auto_insert_metric_name: true
        filename: '{epoch}-{step}-{val_avg_f1:.2f}-{train_loss:.2f}'
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

  fast_dev_run: false
  max_epochs: 10
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  log_every_n_steps: 1
  enable_checkpointing: true
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./logs/conll/checkpoints/
data:
  class_path: CONLLDataModule
  init_args:
    train_path: ../datasets/conll_2003/train.pkl
    val_path: ../datasets/conll_2003/val.pkl
    test_path: ../datasets/conll_2003/test.pkl
    batch_size: 1
    # fill_context: False
    remove_o: False
    o_class_mod: 1
    IOB: 0
    num_labels: 5 # do not change, if IOB = 1 we do math to update num_labels within the data module's init
    effective_sample_weights: False
    beta: .99 # for effective sample weight
    model_class: ModernBertLargeModel #DeBERTaV3LargeModel,ModernBertLargeModel
    max_length: 8000 # 512 or ??? big?
model:
  class_path: src.models.model.EncoderNERModel
  init_args:
    hidden_dropout_prob: .5
    attention_probs_dropout_prob: .1
    pred_output_path: 'logs/conll/test_preds/test_data.csv'
    confusion_matrix_path: 'logs/conll/test_preds/confusion_matrix.csv'
    starting_lr: 1e-5
    max_lr: 1e-4
    weight_decay: 0.01
    pct_start: 0.3
    flooding_val: 0.1
    # o_weight: 0.05
    # IOB: 0 # propagated from data args
    # num_labels: 22 # propagated from data args
    # batch_size: 32 # propagated from data args

ckpt_path: null


