# lightning.pytorch==2.5.0.post0
seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: conll
      save_dir: ./logs/conll
      version: null
      offline: false
      dir: null
      id: null
      anonymous: null
      project: conll
      log_model: false
      experiment: null
      prefix: ''
      checkpoint_name: null
      entity: null
      notes: null
      tags: null
      config: null
      config_exclude_keys: null
      config_include_keys: null
      allow_val_change: null
      group: null
      job_type: null
      mode: null
      force: null
      reinit: null
      resume: null
      resume_from: null
      fork_from: null
      save_code: null
      tensorboard: null
      sync_tensorboard: null
      monitor_gym: null
      settings: null
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: ./logs/conll/checkpoints/
      filename: '{epoch}-{step}-{val_avg_f1:.2f}-{train_loss:.2f}'
      monitor: val_avg_f1
      verbose: false
      save_last: true
      save_top_k: 1
      save_weights_only: false
      mode: max
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: 1
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
      log_momentum: false
      log_weight_decay: false
  fast_dev_run: false
  max_epochs: 10
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  log_every_n_steps: 1
  enable_checkpointing: true
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./logs/conll/checkpoints/
model:
  class_path: src.models.model.EncoderNERModel
  init_args:
    starting_lr: 1.0e-05
    max_lr: 0.0001
    weight_decay: 0.01
    pct_start: 0.3
    flooding_val: 0.1
    pred_output_path: logs/conll/test_preds/test_data.csv
    confusion_matrix_path: logs/conll/test_preds/confusion_matrix.csv
    hidden_dropout_prob: 0.5
    attention_probs_dropout_prob: 0.1
data:
  class_path: src.datamodules.CONLL_data_module.CONLLDataModule
  init_args:
    train_path: datasets/conll_2003/train.pkl
    val_path: datasets/conll_2003/val.pkl
    test_path: datasets/conll_2003/test.pkl
    batch_size: 32
    fill_context: false
    num_labels: 5
    IOB: 0
    remove_o: false
    o_class_mod: 1
    effective_sample_weights: false
    beta: 0.99
    model_class: ModernBertLargeModel
optimizer: null
lr_scheduler: null
ckpt_path: null
