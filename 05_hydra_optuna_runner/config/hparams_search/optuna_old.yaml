# @package _global_
# Note that this file is unused. For optuna trials use optuna_runner.py without reference to this file
defaults:
  - override /hydra/sweeper: optuna
  - override /logger: wandb_optuna
  - override /callbacks: optuna

trainer:
  enable_checkpointing: false

hydra:
  mode: MULTIRUN

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    storage: null
    study_name: gutbrain_ner_optimization
    n_jobs: 1
    direction: maximize
    n_trials: 50
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 20  # Number of random trials before optimization starts

    params:
      model.starting_lr: tag(log, interval(1e-6, 1e-5))
      model.max_lr: tag(log, interval(5e-6, 1e-4))
      model.weight_decay: tag(log, interval(1e-5, 1e-2))
      model.hidden_dropout_prob: interval(0.1, 0.6)
      model.attention_probs_dropout_prob: interval(0.1, 0.5)
      datamodule.beta: tag(log, interval(.9, .999))
      datamodule.o_class_mod: interval(2, 20)


# Metric to be optimized
optimized_metric: "val_avg_f1"
gc_after_trial: True
